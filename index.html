<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Raport FAR</title>
<style>
:root { color-scheme: dark; --bg: #0b0f16; --card: #121923; --line: #222b38; --ink: #eef1f6; --muted: #8792a3; --accent: #3987e5; --bad: #e66767; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: radial-gradient(120% 120% at 100% 0%, #132033 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
main { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 12px; }
.e { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 28px; line-height: 1.15; }
.s { margin: 0 0 6px; font-size: 14px; color: var(--muted); line-height: 1.5; }
label { font-size: 13px; color: var(--muted); }
input { width: 100%; padding: 11px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: inherit; font-size: 15px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { padding: 11px 14px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
#m { margin: 0; min-height: 1.4em; font-size: 13px; color: var(--muted); }
#m.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <form id="f">
    <p class="e">FAR · Raport intern</p>
    <h1>Raport confidențial</h1>
    <p class="s">Introdu parola primită ca să deschizi raportul.</p>
    <label for="p">Parolă</label>
    <input id="p" type="password" autocomplete="current-password" required autofocus>
    <button id="b" type="submit">Deschide raportul</button>
    <p id="m" role="alert"></p>
  </form>
</main>

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const form = document.getElementById('f'), input = document.getElementById('p'), btn = document.getElementById('b'), msg = document.getElementById('m');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; msg.className = ''; msg.textContent = 'Se deschide…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)));
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.className = 'bad'; msg.textContent = 'Parola nu e corectă.';
    btn.disabled = false; input.select();
  }
});
